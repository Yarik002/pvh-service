# =====================================================================
#  Настройки проекта для пакетного менеджера pnpm.
#  Начиная с pnpm 11 настройки структуры node_modules читаются только
#  из этого файла (файл .npmrc используется лишь для registry и авторизации).
# =====================================================================

# nodeLinker: hoisted — зависимости раскладываются в node_modules «плоско»,
# как это делает npm. Такой вариант выбран сознательно:
#   • не требуется поддержка символьных ссылок и junction-точек в Windows;
#   • структура каталога node_modules привычна и понятна при защите проекта;
#   • проект одинаково корректно устанавливается и через pnpm, и через npm.
nodeLinker: hoisted

# Разрешаем выполнение install-скриптов для нативных модулей.
# better-sqlite3 содержит скомпилированный модуль; библиотека поставляет
# готовые бинарные сборки (N-API prebuilds), поэтому компилятор C++ не нужен.
onlyBuiltDependencies:
  - better-sqlite3

# Строгая проверка peer-зависимостей для учебного проекта избыточна
strictPeerDependencies: false
autoInstallPeers: true
allowBuilds:
  better-sqlite3: set this to true or false

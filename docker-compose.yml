# =====================================================================
#  Запуск приложения в контейнерах.
#
#  Состав:
#    app      — сервер приложения (порт 3000)
#    mailpit  — перехватчик писем: принимает письма по SMTP и показывает
#               их в браузере по адресу http://127.0.0.1:8025
#
#  Запуск:            docker compose up -d --build
#  Просмотр писем:    http://127.0.0.1:8025
#  Остановка:         docker compose down
#  Полный сброс БД:   docker compose down -v
#
#  ── Почему письма видны в mailpit, а не приходят на почту ────────────
#  По умолчанию письма принимает перехватчик внутри Docker: это позволяет
#  проверить регистрацию и подтверждение адреса без почтового ящика,
#  и ничего не уходит в интернет.
#
#  Чтобы письма приходили на реальную почту, создайте файл .env.docker
#  (образец — .env.docker.example) с настройками своего почтового сервера
#  и подключите его, добавив в сервис app строку:
#
#      env_file:
#        - .env.docker
#
#  Значения из env_file переопределяют переменные ниже, поэтому правка
#  этого файла не требуется.
# =====================================================================

services:
  app:
    build: .
    container_name: pvh-app
    ports:
      - "3000:3000"

    # Настройки по умолчанию. Любое из значений можно изменить, создав
    # рядом файл .env.docker, скопированный из .env.docker.example,
    # и раскомментировав строку env_file ниже.
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_FILE: /app/data/pvh.db

      # Адрес приложения: подставляется в ссылку подтверждения в письме.
      # Если сайт открывается по другому адресу, исправьте здесь.
      APP_BASE_URL: "http://127.0.0.1:3000"

      # Отправка почты: письма принимает перехватчик mailpit.
      # Для реальной отправки укажите настройки своего почтового сервера.
      # MAIL_TRANSPORT: smtp
      # MAIL_FROM: no-reply@pvh.local
      MAIL_FROM_NAME: "Сервис трекинга заказов и инвентаря для ПВЗ"
      # SMTP_HOST: mailpit
      # SMTP_PORT: 1025
      # SMTP_SECURE: "false"
      # SMTP_REQUIRE_TLS: "false"
      # SMTP_USER: ""
      # SMTP_PASSWORD: ""
      MAIL_CONFIRM_TTL_HOURS: 24

      # Учётная запись администратора создаётся при первом запуске
      ADMIN_EMAIL: admin@pvh.local
      ADMIN_NAME: "Администратор ПВЗ"
      ADMIN_PASSWORD: "Admin#2026Pvh"
      SEED_CELLS_COUNT: 20
    volumes:
      # Файл базы данных сохраняется между перезапусками контейнера
      - ./data:/app/data
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Перехватчик писем: принимает письма по SMTP и показывает их
  # в веб-интерфейсе. В интернет ничего не отправляется.
  mailpit:
    image: axllent/mailpit:latest
    container_name: pvh-mailpit
    ports:
      - "1025:1025"   # приём писем по SMTP
      - "8025:8025"   # просмотр писем в браузере
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

# =====================================================================
#  Запуск приложения в контейнерах.
#
#  Состав:
#    app      — сервер приложения (порт 3000)
#    mailpit  — локальный почтовый ящик (порт 8025 для просмотра)
#
#  Запуск:            docker compose up -d --build
#  Просмотр писем:    http://127.0.0.1:8025
#  Остановка:         docker compose down
#
#  ── Настройки ────────────────────────────────────────────────────────
#  Все параметры приложения берутся из файла .env.docker (строка env_file
#  ниже). В нём указана отправка писем через Gmail — письма приходят
#  на реальную почту.
#
#  ВАЖНО: VPN должен быть ВЫКЛЮЧЕН. VPN-провайдер блокирует SMTP,
#  и письма перестают уходить.
#
#  Если нужно снова отправлять письма в локальный ящик, в .env.docker
#  замените блок Gmail на:
#      MAIL_TRANSPORT=smtp
#      SMTP_HOST=mailpit
#      SMTP_PORT=1025
#      SMTP_SECURE=false
#      MAIL_MAILBOX_URL=http://127.0.0.1:8025
# =====================================================================

services:
  app:
    build: .
    container_name: pvh-app
    ports:
      - "3000:3000"

    # Все настройки приложения — из .env.docker.
    # Значения из env_file имеют приоритет над переменными environment,
    # поэтому почтовые параметры заданы только в файле.
    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_FILE: /app/data/pvh.db

    volumes:
      # Файл базы данных сохраняется между перезапусками контейнера
      - ./data:/app/data
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Локальный почтовый ящик: принимает письма по SMTP и показывает их
  # в веб-интерфейсе. Используется, когда отправка через Gmail недоступна
  # (например, при включённом VPN, который блокирует SMTP).
  mailpit:
    image: axllent/mailpit:latest
    container_name: pvh-mailpit
    ports:
      - "1025:1025"   # приём писем по SMTP
      - "8025:8025"   # просмотр писем в браузере
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

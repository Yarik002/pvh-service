# =====================================================================
#  Запуск приложения в контейнерах.
#
#  Состав:
#    app      — сервер приложения (порт 3000)
#    mailpit  — перехватчик писем: принимает письма по SMTP и показывает
#               их в браузере по адресу http://127.0.0.1:8025
#
#  Запуск:            docker compose up -d --build
#  Просмотр писем:    http://127.0.0.1:8025
#  Остановка:         docker compose down
#  Полный сброс БД:   docker compose down -v
#
#  ── Почему письма видны в mailpit, а не приходят на почту ────────────
#  Письма принимает перехватчик внутри Docker. Это позволяет проверить
#  регистрацию и подтверждение адреса без почтового ящика: письмо видно
#  в браузере, и ничего не зависит от интернета и почтовых серверов.
#
#  Настройки почты заданы прямо в этом файле (блок environment ниже),
#  поэтому `docker compose up -d --build` работает сразу, без подготовки.
# =====================================================================

services:
  app:
    build: .
    container_name: pvh-app
    ports:
      - "3000:3000"

    # Все настройки заданы здесь, чтобы запуск не зависел от других файлов.
    # Чтобы переопределить их, раскомментируй строки env_file и заполни
    # файл .env.docker (образец — .env.docker.example).
    # env_file:
    #   - .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_FILE: /app/data/pvh.db

      # Адрес приложения: подставляется в ссылку подтверждения в письме.
      # Если сайт открывается по другому адресу, исправьте здесь.
      APP_BASE_URL: "http://127.0.0.1:3000"

      # --- Отправка почты ---------------------------------------------
      # Письма принимает перехватчик mailpit (имя сервиса ниже).
      # Хост указан по имени сервиса: внутри Docker они видят друг друга
      # по именам, порт наружу не нужен.
      MAIL_TRANSPORT: smtp
      MAIL_FROM: no-reply@pvh.local
      MAIL_FROM_NAME: "Сервис трекинга заказов и инвентаря для ПВЗ"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      MAIL_CONFIRM_TTL_HOURS: 24
      # Адрес локального веб-ящика. Показывается пользователю после
      # регистрации, чтобы он не искал письмо в обычной почте.
      # Письма принимает перехватчик mailpit на порту 8025.
      MAIL_MAILBOX_URL: "http://127.0.0.1:8025"

      # --- Отправка через HTTPS-API почтового сервиса ------------------
      # Применяется, когда SMTP блокируется провайдером. Чтобы включить,
      # задайте MAIL_TRANSPORT=api, название сервиса и ключ доступа.
      # Значения можно передать через файл .env.docker (env_file выше).
      MAIL_API_PROVIDER: ${MAIL_API_PROVIDER:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_API_TIMEOUT: ${MAIL_API_TIMEOUT:-20000}

      # Учётная запись администратора создаётся при первом запуске
      ADMIN_EMAIL: admin@pvh.local
      ADMIN_NAME: "Администратор ПВЗ"
      ADMIN_PASSWORD: "Admin#2026Pvh"
      SEED_CELLS_COUNT: 20
    volumes:
      # Файл базы данных сохраняется между перезапусками контейнера
      - ./data:/app/data
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Перехватчик писем: принимает письма по SMTP и показывает их
  # в веб-интерфейсе. В интернет ничего не отправляется.
  mailpit:
    image: axllent/mailpit:latest
    container_name: pvh-mailpit
    ports:
      - "1025:1025"   # приём писем по SMTP
      - "8025:8025"   # просмотр писем в браузере
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped
